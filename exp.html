<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="exp.js"></script>
    <link rel="stylesheet" href="exp.css">
</head>
<body>
    <div class="main">
        <header class="heading">
            <h1>Expense Tracker</h1>
        </header>

        <section class="input">
            <input type="text" id="name" placeholder="Expense Name">
            <input type="text" id="amt" placeholder="Amount">

            <select id="category">
                <option value="">Select Category</option>
                <option value="Transport">Transport</option>
                <option value="Foods">Foods</option>
                <option value="Clothing">Clothing</option>
                <option value="Gifts">Gifts</option>
                <option value="Electronics">Electronics</option>
            </select>

            <input type="date" id="date">

            <button type="button" onclick="add()">Add Expense</button>

        </section>

        <section class="table">
            <table cellspacing="0" id="output">
                <thead>
                    <tr>
                        <th>Expense Name</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
            </table>
        </section>

        <section class="total">
            <span id="totalDisplay">Total: $0</span>
            <div class="filter">
                Filter by Category: <select id="filterCategory">
                <option value="">All</option>
                <option value="Transport">Transport</option>
                <option value="Foods">Foods</option>
                <option value=Clothing">Clothing</option>
                <option value="Gifts">Gifts</option>
                <option value="Electronics">Electronics</option>
            </select>
            </div>
        </section>

    </div>




    

    <!-- Edit Modal -->
<div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
     background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">

  <div style="background:white; padding:30px; border-radius:10px; min-width:300px;">
    <h3>Edit Expense</h3>

    <input type="hidden" id="editId">

    <label>Name</label><br>
    <input type="text" id="editName"><br><br>

    <label>Amount</label><br>
    <input type="text" id="editAmt"><br><br>

    <label>Category</label><br>
    <select id="editCategory">
      <option value="">Select Category</option>
      <option value="Transport">Transport</option>
      <option value="Foods">Foods</option>
      <option value="Clothing">Clothing</option>
      <option value="Gifts">Gifts</option>
      <option value="Electronics">Electronics</option>
    </select><br><br>

    <label>Date</label><br>
    <input type="date" id="editDate"><br><br>

    <button onclick="saveEdit()">Save</button>
    &nbsp;
    <button onclick="closeEditModal()">Cancel</button>
  </div>

</div>
</body>
</html>
