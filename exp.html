<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="exp.js"></script>
    <link rel="stylesheet" href="exp.css">
</head>
<body>
    <div class="main">
        <header class="heading">
            <h1>Expense Tracker</h1>
            <p id="message">Fill in the details of your expense.</p>
        </header>

        <section class="input">
            <input type="text" id="name" placeholder="Expense Name">
            <input type="text" id="amt" placeholder="Amount">

            <select id="category">
                <option value="">Select Category</option>
                <option value="Transport">Transport</option>
                <option value="Foods">Foods</option>
                <option value="Clothing">Clothing</option>
                <option value="Gifts">Gifts</option>
                <option value="Electronics">Electronics</option>
            </select>

            <input type="date" id="date">

            <button type="button" onclick="add()">Add Expense</button>

        </section>

        <section class="table">
            <table cellspacing="0" id="output">
                <thead>
                    <tr id="first_row">
                        <th>Expense Name</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
            </table>
        </section>

        <section class="total">
            <span id="totalDisplay">Total: $0</span>
            <div class="filter">
                Filter by Category: <select id="filterCategory" onchange="filterFunction()">
                <option value="">All</option>
                <option value="Transport">Transport</option>
                <option value="Foods">Foods</option>
                <option value="Clothing">Clothing</option>
                <option value="Gifts">Gifts</option>
                <option value="Electronics">Electronics</option>
            </select>
            </div>
        </section>

    </div>

</div>
</body>
</html>
